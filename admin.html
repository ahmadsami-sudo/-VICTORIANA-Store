<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم فيكتوريانا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f5f1e8;
            padding: 20px;
        }
        
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8b7355;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .admin-title {
            color: #8b7355;
            font-size: 32px;
            font-family: 'Times New Roman', serif;
        }
        
        .admin-badge {
            background: #8b7355;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .login-form h2 {
            color: #8b7355;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d4c9b1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #8b7355;
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #8b7355;
            color: white;
        }
        
        .btn-primary:hover {
            background: #a08666;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #d32f2f;
        }
        
        .btn-warning {
            background: #ff9800;
            color: white;
        }
        
        .btn-warning:hover {
            background: #f57c00;
        }
        
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        
        .product-form {
            background: #f9f6f0;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .product-form h3 {
            color: #8b7355;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .products-table th {
            background: #8b7355;
            color: white;
            padding: 12px;
            text-align: right;
        }
        
        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #d4c9b1;
            vertical-align: middle;
        }
        
        .products-table tr:hover {
            background: #f9f6f0;
        }
        
        .product-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .action-buttons .btn {
            padding: 6px 12px;
            font-size: 13px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f9f6f0;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #8b7355;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .hidden {
            display: none !important;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .products-table {
                font-size: 14px;
            }
            
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<!-- صفحة تسجيل الدخول -->
<div id="loginPage" class="login-form">
    <h2>🔐 لوحة التحكم</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="adminPassword" class="form-control" placeholder="أدخل كلمة المرور">
        </div>
        <button type="submit" class="btn btn-primary btn-block">
            <i class="fas fa-unlock"></i> دخول
        </button>
    </form>
    <p style="text-align: center; margin-top: 20px; color: #999; font-size: 14px;">
        كلمة المرور الافتراضية: <strong>admin123</strong>
    </p>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel" class="admin-container hidden">
    <div class="admin-header">
        <div>
            <h1 class="admin-title">👑 فيكتوريانا - لوحة التحكم</h1>
            <span class="admin-badge">مدير الموقع</span>
        </div>
        <div>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل خروج
            </button>
            <a href="index.html" target="_blank" class="btn btn-primary">
                <i class="fas fa-eye"></i> عرض الموقع
            </a>
        </div>
    </div>
    
    <!-- التنبيهات -->
    <div id="alertMessage" class="alert"></div>
    
    <!-- الإحصائيات -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalProducts">0</div>
            <div class="stat-label">📦 إجمالي المنتجات</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalCategories">0</div>
            <div class="stat-label">🏷️ التصنيفات</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalValue">0</div>
            <div class="stat-label">💰 قيمة المخزون</div>
        </div>
    </div>
    
    <!-- نموذج إضافة/تعديل منتج -->
    <div class="product-form">
        <h3 id="formTitle">➕ إضافة منتج جديد</h3>
        <form id="productForm">
            <input type="hidden" id="editId" value="">
            
            <div class="form-row">
                <div class="form-group">
                    <label>اسم المنتج *</label>
                    <input type="text" id="prodName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>السعر (د.أ) *</label>
                    <input type="number" id="prodPrice" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>الوصف</label>
                <textarea id="prodDesc" class="form-control" rows="3"></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>الألوان (افصلها بفاصلة)</label>
                    <input type="text" id="prodColors" class="form-control" placeholder="ذهبي, أبيض, وردي">
                </div>
                <div class="form-group">
                    <label>المقاسات (افصلها بفاصلة)</label>
                    <input type="text" id="prodSizes" class="form-control" placeholder="16, 17, 18">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>التصنيف *</label>
                    <select id="prodCategory" class="form-control" required>
                        <option value="rings">💍 خواتم</option>
                        <option value="necklaces">📿 أطقم</option>
                        <option value="earrings">💎 أقراط</option>
                        <option value="bracelets">⌚ أساور</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الشارة (اختياري)</label>
                    <input type="text" id="prodBadge" class="form-control" placeholder="جديد, الأكثر مبيعاً">
                </div>
            </div>
            
            <div class="form-group">
                <label>رابط الصورة *</label>
                <input type="url" id="prodImage" class="form-control" placeholder="https://example.com/image.jpg" required>
                <small style="color: #666;">يمكنك رفع الصور على <a href="https://imgbb.com" target="_blank">ImgBB</a> والحصول على رابط مباشر</small>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> حفظ المنتج
                </button>
                <button type="reset" class="btn btn-warning" onclick="resetForm()">
                    <i class="fas fa-undo"></i> إلغاء
                </button>
            </div>
        </form>
    </div>
    
    <!-- قائمة المنتجات -->
    <h3 style="color: #8b7355; margin-bottom: 20px;">📋 قائمة المنتجات</h3>
    <div style="overflow-x: auto;">
        <table class="products-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>الصورة</th>
                    <th>الاسم</th>
                    <th>السعر</th>
                    <th>التصنيف</th>
                    <th>العمليات</th>
                </tr>
            </thead>
            <tbody id="productsTableBody">
                <!-- سيتم عرض المنتجات هنا -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ======== إعدادات الأمان ========
    const ADMIN_PASSWORD = 'admin123'; // غير كلمة المرور هنا
    
    // ======== إدارة المنتجات ========
    let products = [];
    
    // تحميل المنتجات
    function loadProducts() {
        const saved = localStorage.getItem('products');
        if (saved) {
            products = JSON.parse(saved);
        } else {
            // إذا لم يكن هناك منتجات، استخدم المنتجات الافتراضية
            products = [
                {
                    id: 1,
                    name: "خاتم الماس الفاخر",
                    price: 250,
                    description: "خاتم من الذهب عيار 21 مع ماس طبيعي",
                    colors: ["ذهبي", "أبيض"],
                    sizes: ["16", "17", "18"],
                    category: "rings",
                    image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
                    badge: "الأكثر مبيعاً",
                    rating: 5,
                    reviews: 24
                },
                {
                    id: 2,
                    name: "عقد اللؤلؤ النادر",
                    price: 380,
                    description: "عقد من اللؤلؤ الطبيعي مع فضة إيطالية",
                    colors: ["أبيض", "زهري"],
                    sizes: ["42", "45", "48"],
                    category: "necklaces",
                    image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
                    badge: "جديد",
                    rating: 4,
                    reviews: 18
                }
            ];
            saveProducts();
        }
        renderProducts();
        updateStats();
    }
    
    // حفظ المنتجات
    function saveProducts() {
        localStorage.setItem('products', JSON.stringify(products));
        // مزامنة مع الموقع الرئيسي
        try {
            // إذا كان الموقع الرئيسي في نفس المجلد، سيتم التحديث تلقائياً
            localStorage.setItem('sharedProducts', JSON.stringify(products));
        } catch(e) {}
    }
    
    // عرض المنتجات في الجدول
    function renderProducts() {
        const tbody = document.getElementById('productsTableBody');
        if (!tbody) return;
        
        tbody.innerHTML = products.map((p, index) => `
            <tr>
                <td>${index + 1}</td>
                <td><img src="${p.image}" alt="${p.name}" class="product-thumb" onerror="this.src='https://via.placeholder.com/60'"></td>
                <td><strong>${p.name}</strong></td>
                <td>${p.price} د.أ</td>
                <td>${getCategoryName(p.category)}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn btn-warning" onclick="editProduct(${p.id})">
                            <i class="fas fa-edit"></i> تعديل
                        </button>
                        <button class="btn btn-danger" onclick="deleteProduct(${p.id})">
                            <i class="fas fa-trash"></i> حذف
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
        
        document.getElementById('totalProducts').textContent = products.length;
    }
    
    // الحصول على اسم التصنيف بالعربي
    function getCategoryName(category) {
        const names = {
            'rings': 'خواتم',
            'necklaces': 'أطقم',
            'earrings': 'أقراط',
            'bracelets': 'أساور'
        };
        return names[category] || category;
    }
    
    // تحديث الإحصائيات
    function updateStats() {
        const total = products.length;
        const categories = new Set(products.map(p => p.category));
        const totalValue = products.reduce((sum, p) => sum + p.price, 0);
        
        document.getElementById('totalProducts').textContent = total;
        document.getElementById('totalCategories').textContent = categories.size;
        document.getElementById('totalValue').textContent = totalValue.toLocaleString() + ' د.أ';
    }
    
    // إضافة/تعديل منتج
    function saveProduct(e) {
        e.preventDefault();
        
        const id = document.getElementById('editId').value;
        const product = {
            name: document.getElementById('prodName').value,
            price: parseFloat(document.getElementById('prodPrice').value),
            description: document.getElementById('prodDesc').value,
            colors: document.getElementById('prodColors').value.split(',').map(c => c.trim()).filter(c => c),
            sizes: document.getElementById('prodSizes').value.split(',').map(s => s.trim()).filter(s => s),
            category: document.getElementById('prodCategory').value,
            image: document.getElementById('prodImage').value,
            badge: document.getElementById('prodBadge').value || '',
            rating: 5,
            reviews: 0
        };
        
        if (id) {
            // تعديل منتج موجود
            const index = products.findIndex(p => p.id == id);
            if (index !== -1) {
                products[index] = { ...products[index], ...product };
                showAlert('✅ تم تحديث المنتج بنجاح!', 'success');
            }
        } else {
            // إضافة منتج جديد
            product.id = Date.now();
            products.push(product);
            showAlert('✅ تم إضافة المنتج بنجاح!', 'success');
        }
        
        saveProducts();
        renderProducts();
        updateStats();
        resetForm();
    }
    
    // تعديل منتج
    function editProduct(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;
        
        document.getElementById('editId').value = product.id;
        document.getElementById('prodName').value = product.name;
        document.getElementById('prodPrice').value = product.price;
        document.getElementById('prodDesc').value = product.description || '';
        document.getElementById('prodColors').value = (product.colors || []).join(', ');
        document.getElementById('prodSizes').value = (product.sizes || []).join(', ');
        document.getElementById('prodCategory').value = product.category;
        document.getElementById('prodImage').value = product.image;
        document.getElementById('prodBadge').value = product.badge || '';
        
        document.getElementById('formTitle').textContent = '✏️ تعديل المنتج';
        document.querySelector('#productForm button[type="submit"]').innerHTML = '<i class="fas fa-edit"></i> تحديث المنتج';
        
        // التمرير للنموذج
        document.querySelector('.product-form').scrollIntoView({ behavior: 'smooth' });
    }
    
    // حذف منتج
    function deleteProduct(id) {
        if (!confirm('⚠️ هل أنت متأكد من حذف هذا المنتج؟')) return;
        
        products = products.filter(p => p.id !== id);
        saveProducts();
        renderProducts();
        updateStats();
        showAlert('🗑️ تم حذف المنتج بنجاح!', 'success');
        
        // إذا كان المنتج المحذوف هو المفتوح للتعديل، أعد تعيين النموذج
        if (document.getElementById('editId').value == id) {
            resetForm();
        }
    }
    
    // إعادة تعيين النموذج
    function resetForm() {
        document.getElementById('productForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('formTitle').textContent = '➕ إضافة منتج جديد';
        document.querySelector('#productForm button[type="submit"]').innerHTML = '<i class="fas fa-save"></i> حفظ المنتج';
    }
    
    // عرض التنبيهات
    function showAlert(message, type = 'success') {
        const alert = document.getElementById('alertMessage');
        alert.textContent = message;
        alert.className = `alert alert-${type} show`;
        setTimeout(() => {
            alert.classList.remove('show');
        }, 3000);
    }
    
    // ======== تسجيل الدخول ========
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const password = document.getElementById('adminPassword').value;
        
        if (password === ADMIN_PASSWORD) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPanel').classList.remove('hidden');
            loadProducts();
        } else {
            alert('❌ كلمة المرور خاطئة!');
            document.getElementById('adminPassword').value = '';
        }
    });
    
    // ======== تسجيل الخروج ========
    function logout() {
        if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPassword').value = '';
        }
    }
    
    // ======== ربط النموذج ========
    document.getElementById('productForm').addEventListener('submit', saveProduct);
    
    // ======== تحميل تلقائي ========
    // إذا كان مسجل دخول مسبقاً (اختياري)
    // loadProducts();
    
    console.log('🛠️ لوحة تحكم فيكتوريانا جاهزة!');
</script>

</body>
</html>
